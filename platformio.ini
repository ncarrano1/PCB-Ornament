; PCB Ornament firmware (STM32F103RBT6)
; Build/flash with PlatformIO:  pio run -e <env> -t upload
; Or flash .pio/build/<env>/firmware.bin with STM32CubeProgrammer.

[platformio]
default_envs = blink_one

[env]
platform = ststm32
board = genericSTM32F103RB
framework = stm32cube
debug_tool = stlink
; Upload through STM32CubeProgrammer's CLI: OpenOCD's flash algorithm times
; out on this board. NRST isn't wired, so use a software reset (SWrst).
; Change custom_cubeprog_cli if STM32CubeProgrammer is installed elsewhere.
custom_cubeprog_cli = /Applications/STMicroelectronics/STM32Cube/STM32CubeProgrammer/STM32CubeProgrammer.app/Contents/Resources/bin/STM32_Programmer_CLI
upload_protocol = custom
upload_command = "${this.custom_cubeprog_cli}" -c port=SWD mode=Normal reset=SWrst -w "$SOURCE" 0x08000000 -v -rst
build_src_flags = -Wall -Wextra   ; project sources only; ST HAL has its own warnings

; Test 1: blink a single LED (D1)
[env:blink_one]
build_src_filter = +<board.c> +<blink_one.c>

; Test 2: one LED at a time chasing around the ring
[env:ring_chase]
build_src_filter = +<board.c> +<ring_chase.c>

; Program 3: smooth traveling wave (BCM brightness), button cycles modes
[env:wave]
build_src_filter = +<board.c> +<led_bcm.c> +<bcm_frame.c> +<wave_anim.c> +<wave.c>

; Final firmware: 10 modes on the button (banked BCM engine, src/modes/)
[env:ornament]
build_src_filter = +<board.c> +<ring_frame.c> +<ring_engine.c> +<tables.c> +<ornament_core.c> +<button_fsm.c> +<gauge.c> +<mode_store.c> +<power.c> +<ornament.c> +<modes/>
board_upload.maximum_size = 130048  ; last 1 KB flash page holds the saved mode
